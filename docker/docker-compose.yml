services:
  db:
    image: postgres:17-alpine
    environment:
      - 'POSTGRES_USER=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'POSTGRES_DB=paperclip'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    pids_limit: 2048
    stop_grace_period: 90s
    environment:
      - SERVICE_URL_SERVER_3100
      - 'DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/paperclip'
      - 'PORT=3100'
      - 'SERVE_UI=true'
      - 'PAPERCLIP_DEPLOYMENT_MODE=authenticated'
      - 'PAPERCLIP_DEPLOYMENT_EXPOSURE=public'
      - 'PAPERCLIP_PUBLIC_URL=${PAPERCLIP_PUBLIC_URL}'
      - 'PAPERCLIP_AUTH_PUBLIC_BASE_URL=${PAPERCLIP_PUBLIC_URL}'
      - 'PAPERCLIP_ALLOWED_HOSTNAMES=${PAPERCLIP_HOSTNAME}'
      - 'BETTER_AUTH_SECRET=${SERVICE_PASSWORD_64_BETTERAUTH}'
      - 'PAPERCLIP_TOOL_ACTION_SIGNING_SECRET=${SERVICE_PASSWORD_64_TOOLSIGNING}'
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  paperclip-data:
